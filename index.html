<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2EDE4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>大帅比工作台</title>
<style>
:root{
  --oat:#F2EDE4;
  --cream:#FAF7F1;
  --sand:#EAE2D5;
  --clay:#D6C9B4;
  --ink:#33291F;
  --ink-2:#6E6355;
  --muted:#9C9080;
  --line:#E5DCCD;
  --line-soft:#EFE8DC;
  --viz:#B5622F;
  --crimson:#A6503C;
  --amber:#B08A4A;
  --olive:#77805C;
  --cocoa:#463A2E;
  --umber:#8A7358;
  --umber-d:#6F5C45;
  --code-bg:#EFE7D8;
  --code-fg:#8A5A2B;
  --radius:16px;
  --shadow:0 1px 2px rgba(70,58,46,.04), 0 8px 22px rgba(70,58,46,.05);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Source Han Serif SC","Songti SC",STSong,SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--oat);
  min-height:100vh;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:16px;
  padding:12px 22px;
  background:rgba(242,237,228,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex; align-items:center; gap:11px;
  font-family:var(--serif);
  font-size:17px; font-weight:700; letter-spacing:.08em;
  color:var(--ink); white-space:nowrap;
}
.brand .sq{
  width:36px; height:36px; border-radius:11px;
  background:var(--umber); color:#FBF8F2;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; letter-spacing:0;
  box-shadow:0 2px 9px rgba(138,115,88,.3);
}
.searchbox{flex:1; max-width:420px; margin-left:auto; position:relative}
.searchbox input{
  width:100%; height:38px; padding:0 14px 0 36px;
  border:1px solid var(--line); border-radius:999px;
  background:var(--cream); color:var(--ink); font-size:14px;
  outline:none; transition:.18s; font-family:inherit;
}
.searchbox input:focus{background:#fff; border-color:var(--clay); box-shadow:0 0 0 3px rgba(138,115,88,.12)}
.searchbox .ico{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:13px; pointer-events:none;
}
.topbar .hint{font-size:11px; color:var(--muted); white-space:nowrap; letter-spacing:.5px}

.layout{display:flex; align-items:flex-start; max-width:1500px; margin:0 auto}
.sidebar{
  position:sticky; top:64px;
  width:216px; flex:0 0 216px;
  padding:20px 14px 40px;
  height:calc(100vh - 64px);
  overflow-y:auto;
}
.nav{display:flex; flex-direction:column; gap:6px}
.nav-item{
  display:flex; align-items:center; gap:9px;
  width:100%; padding:11px 12px;
  border:1px solid transparent; border-radius:10px;
  background:transparent; cursor:pointer;
  font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-2);
  letter-spacing:.2px; text-align:left; transition:.18s;
}
.nav-item:hover{background:var(--sand)}
.nav-item .ic{font-size:15px}
.nav-item em{
  margin-left:auto; font-style:normal; font-size:11px; font-weight:700;
  color:var(--muted); background:var(--line-soft); border-radius:999px; padding:1px 8px;
}
.nav-item.active{
  background:var(--sand); color:var(--cocoa);
  box-shadow:inset 0 0 0 1px var(--clay);
}
.nav-item.active em{background:var(--clay); color:var(--cocoa)}
.side-sep{margin:18px 4px 10px; font-size:10px; font-weight:600; color:var(--muted); letter-spacing:2px}
.side-tip{
  margin-top:8px; padding:12px 13px; border-radius:12px;
  background:var(--cream); border:1px solid var(--line-soft);
  font-size:11.5px; line-height:1.8; color:var(--muted);
}
.side-tip b{color:var(--ink-2)}

.content{flex:1; min-width:0; padding:16px 22px 80px}
.view-head{
  display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;
  padding:10px 4px 14px;
}
.view-head h1{
  margin:0; font-family:var(--serif);
  font-size:22px; font-weight:700; color:var(--ink); letter-spacing:.06em;
}
.view-head .sub{font-size:12px; color:var(--muted); padding-bottom:4px; letter-spacing:.4px}
.tools{margin-left:auto; display:flex; gap:8px}
.tbtn{
  height:31px; padding:0 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--cream); color:var(--ink-2);
  font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
  letter-spacing:.3px; transition:.15s;
}
.tbtn:hover{border-color:var(--clay); color:var(--cocoa); background:var(--sand)}

.modes{
  display:flex; gap:4px; padding:3px;
  background:var(--sand); border:1px solid var(--line); border-radius:999px;
}
.mbtn{
  height:25px; padding:0 12px; border:0; border-radius:999px;
  background:transparent; color:var(--ink-2);
  font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
  white-space:nowrap; letter-spacing:.3px; transition:.16s;
}
.mbtn:hover{color:var(--cocoa)}
.mbtn.on{
  background:var(--cream); color:var(--cocoa);
  box-shadow:0 1px 4px rgba(70,58,46,.14);
}

/* ===== 三色标记（背诵用） ===== */
.marks{display:flex; gap:8px; margin:0 0 12px}
.mk{
  flex:1; height:33px; border-radius:10px;
  border:1px solid transparent; background:var(--sand); color:var(--muted);
  font-family:inherit; font-size:13px; font-weight:700; letter-spacing:.3px;
  cursor:pointer; transition:.15s;
}
.mk-red{background:#F3E3DD; color:#A6503C; border-color:#E8CFC5}
.mk-yellow{background:#F3EBD9; color:#8F6E2E; border-color:#E5D6B4}
.mk-green{background:#E9EDE0; color:#5C6B3D; border-color:#D4DBBF}
.mk:hover{transform:translateY(-1px)}
.mk:active{transform:scale(.98)}
.mk-red.on{background:var(--crimson); border-color:var(--crimson); color:#FBF8F2; box-shadow:0 2px 9px rgba(166,80,60,.28)}
.mk-yellow.on{background:var(--amber); border-color:var(--amber); color:#FBF8F2; box-shadow:0 2px 9px rgba(176,138,74,.28)}
.mk-green.on{background:var(--olive); border-color:var(--olive); color:#FBF8F2; box-shadow:0 2px 9px rgba(119,128,92,.28)}

.q-dot{
  flex:0 0 auto; width:8px; height:8px; border-radius:50%;
  margin-top:9px; background:var(--cream); border:1px solid var(--clay);
}
.q-dot.red{background:var(--crimson); border-color:var(--crimson)}
.q-dot.yellow{background:var(--amber); border-color:var(--amber)}
.q-dot.green{background:var(--olive); border-color:var(--olive)}

/* ===== 筛选 + 统计 ===== */
.filters{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:0 4px 10px}
.fchip{
  height:28px; padding:0 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--cream); color:var(--ink-2);
  font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; letter-spacing:.3px; transition:.15s;
}
.fchip:hover{border-color:var(--clay); color:var(--cocoa)}
.fchip.on{
  background:var(--sand); color:var(--cocoa);
  box-shadow:inset 0 0 0 1px var(--clay);
}
.fchip em{font-style:normal; font-size:11px; opacity:.65; margin-left:3px}
.fstat{margin-left:auto; font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; letter-spacing:.3px}
.fstat b{color:var(--viz)}
.fbar{margin:0 4px 8px; height:4px; border-radius:999px; background:#EADFCB; overflow:hidden}
.fbar i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#D4884A,#B5622F); transition:width .35s ease}

.mod{
  display:flex; align-items:center; gap:10px;
  margin:22px 2px 12px;
  font-family:var(--serif);
  font-size:14.5px; font-weight:700; color:var(--ink-2); letter-spacing:.14em;
}
.mod::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--viz); flex:0 0 auto}
.mod::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent)}
.mod .cnt{font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:1px; font-family:var(--sans)}

.q{
  background:var(--cream);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  margin-bottom:10px;
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:border-color .18s, box-shadow .18s;
}
.q:hover{border-color:var(--line)}
.q.open{border-color:var(--clay); box-shadow:0 2px 6px rgba(70,58,46,.06), 0 14px 30px rgba(70,58,46,.08)}
.q-head{
  display:flex; align-items:flex-start; gap:11px;
  padding:14px 16px; cursor:pointer; user-select:none;
}
.q-no{
  flex:0 0 auto; min-width:26px; height:24px; padding:0 7px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:7px; background:var(--sand); color:var(--umber-d);
  font-size:11px; font-weight:700; letter-spacing:.3px;
  margin-top:1px;
}
.q-title{
  flex:1; margin:0; font-family:var(--serif);
  font-size:16px; line-height:1.6;
  font-weight:700; color:var(--ink); word-break:break-word; letter-spacing:.02em;
}
.q-chev{
  flex:0 0 auto; color:var(--clay); font-size:16px; line-height:1.5;
  transition:transform .22s; margin-top:1px;
}
.q.open .q-chev{transform:rotate(90deg); color:var(--viz)}
.q-body{display:none; padding:0 16px 16px}
.q.open .q-body{display:block; animation:fade .22s ease}
@keyframes fade{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}

.pt{
  padding:0 0 13px;
  margin-bottom:13px;
  border-bottom:1px dashed var(--line);
  background:transparent;
}
.pt:last-of-type{border-bottom:0; margin-bottom:0; padding-bottom:0}
.pt-label{
  display:block;
  font-size:13px; font-weight:700;
  color:var(--crimson);
  letter-spacing:.4px;
  margin-bottom:7px;
}
.pt-label:empty{display:none}
.pt-text{
  font-size:15px; font-weight:600; color:var(--ink);
  line-height:2.05;
  word-break:break-word;
  letter-spacing:.2px;
}

/* ===== 答案区：整块统一暖米底 ===== */
.ans-wrap{
  position:relative;
  background:#F5EFE3;
  border:1px solid var(--line-soft);
  border-radius:12px;
  padding:15px 16px 14px;
}
.ans-body{transition:opacity .18s ease}
.ans-mask{display:none}

/* 背诵模式：答案整块收起，只留题目 + 一个「点击显示答案」按钮 */
body.mode-recite .ans-wrap:not(.revealed){
  background:var(--cream);
  border:1px dashed var(--clay);
  padding:9px 12px;
}
body.mode-recite .ans-wrap:not(.revealed) .ans-body{display:none}
body.mode-recite .ans-wrap:not(.revealed) .ans-mask{
  display:flex; position:static; inset:auto;
  align-items:center; justify-content:center;
  background:none; cursor:pointer;
}
.ans-mask span{
  padding:8px 18px; border-radius:999px;
  background:var(--sand); border:1px solid var(--clay); color:var(--umber-d);
  font-size:13px; font-weight:700; letter-spacing:.4px;
}
.ans-wrap.revealed .ans-mask{display:none !important}

code{
  font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
  font-size:.88em;
  background:var(--code-bg);
  color:var(--code-fg);
  border:1px solid var(--line);
  border-radius:5px;
  padding:1px 5px;
  margin:0 1px;
  font-weight:700;
  white-space:nowrap;
}

.q-note{
  margin-top:12px; padding:9px 13px;
  border-radius:9px; background:var(--cream); border:1px dashed var(--clay);
  font-size:12.5px; font-weight:600; color:var(--ink-2); line-height:1.9;
}
.empty{
  text-align:center; padding:70px 20px;
  color:var(--muted); font-size:14px; font-weight:600; letter-spacing:.3px;
}

@media (max-width:860px){
  .topbar{padding:10px 14px; gap:10px; flex-wrap:wrap}
  .brand{font-size:16px}
  .brand .sq{width:32px; height:32px; border-radius:10px; font-size:14px}
  .searchbox{max-width:none; order:3; flex:1 1 100%}
  .topbar .hint{display:none}
  .layout{display:block}
  .sidebar{
    position:sticky; top:96px; z-index:40;
    width:100%; height:auto; padding:8px 14px;
    display:flex; gap:8px; overflow-x:auto;
    background:rgba(242,237,228,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{flex-direction:row; gap:8px}
  .nav-item{width:auto; padding:8px 14px; border-radius:999px; font-size:13px; white-space:nowrap}
  .nav-item em{display:none}
  .side-sep,.side-tip{display:none}
  .content{padding:12px 14px 90px}
  .view-head{padding:6px 2px 10px; align-items:center}
  .view-head h1{font-size:19px}
  .tools{width:100%; margin-left:0; gap:8px; flex-wrap:wrap}
  .modes{order:-1}
  .mbtn{height:26px; padding:0 13px}
  .q-head{padding:12px 13px}
  .q-title{font-size:15px}
  .q-body{padding:0 13px 13px}
  .pt{padding:11px 12px 12px; padding:0 0 12px}
  .pt-text{font-size:14.5px; line-height:1.95}
  .pt-label{font-size:12.5px}
  code{white-space:normal}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="sq">背</span>大帅比工作台</div>
  <div class="searchbox">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="搜题目 / 搜关键词，比如 String、索引" autocomplete="off">
  </div>
  <span class="hint" id="cntHint"></span>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav">
      <button class="nav-item active" data-view="interview"><span class="ic">📘</span>面试问题<em id="nIv">0</em></button>
      <button class="nav-item" data-view="hr"><span class="ic">🤝</span>人事问题<em id="nHr">0</em></button>
    </nav>
    <div class="side-sep">使用提示</div>
    <div class="side-tip"><b>📖 阅读模式</b>：展开题目直接看答案。<br><b>🎯 背诵模式</b>：展开只显示题目，点「点击显示答案」再看全文，适合自测。<br>点标题展开收起；小点标题红色，正文加粗，技术名词为行内代码。</div>
  </aside>

  <main class="content">
    <div class="view-head">
      <h1 id="vTitle">面试问题</h1>
      <span class="sub" id="vSub"></span>
      <div class="tools">
        <div class="modes">
          <button class="mbtn on" data-mode="read">📖 阅读模式</button>
          <button class="mbtn" data-mode="recite">🎯 背诵模式</button>
        </div>
        <button class="tbtn" id="expandAll">全部展开</button>
        <button class="tbtn" id="collapseAll">全部收起</button>
      </div>
    </div>
    <div class="filters" id="filters">
      <button class="fchip on" data-f="all">全部</button>
      <button class="fchip" data-f="none">未标记</button>
      <button class="fchip" data-f="green">已掌握</button>
      <button class="fchip" data-f="yellow">不熟练</button>
      <button class="fchip" data-f="red">没印象</button>
      <span class="fstat" id="fStat"></span>
    </div>
    <div class="fbar"><i id="fBar"></i></div>
    <div id="list"></div>
  </main>
</div>

<script src="data/iv1.js"></script>
<script src="data/iv2.js"></script>
<script src="data/iv3.js"></script>
<script src="data/iv4.js"></script>
<script src="data/iv5.js"></script>
<script src="data/hr.js"></script>
<script>
(function(){
  "use strict";

  var IV = window.__IV || [];
  var HR = window.__HR || [];

  var MOD_ORDER = ["Java基础","Java高级","Java集合","多线程","框架","SQL","MySQL","Redis","前端","反射","工具","Linux","场景题","SpringAI"];
  var HR_ORDER  = ["人事题","项目问题","求职场景"];

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /* 反引号内容 + 英文标识符 → 行内代码 */
  function rich(raw){
    var s = String(raw == null ? "" : raw);
    var re = /`([^`]+)`|([A-Za-z_@][A-Za-z0-9_.@#$\/\-]*)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(s))) {
      out += esc(s.slice(last, m.index));
      if (m[1] !== undefined) {
        out += "<code>" + esc(m[1]) + "</code>";
      } else {
        var t = m[2];
        if (t.length >= 3 || t.charAt(0) === "@") out += "<code>" + esc(t) + "</code>";
        else out += esc(t);
      }
      last = re.lastIndex;
    }
    out += esc(s.slice(last));
    return out.replace(/\n/g, "<br>");
  }

  function sortBy(arr, key, order){
    var idx = {};
    order.forEach(function(m,i){ idx[m] = i; });
    arr.sort(function(a,b){
      var ia = idx[a[key]] === undefined ? 99 : idx[a[key]];
      var ib = idx[b[key]] === undefined ? 99 : idx[b[key]];
      return ia - ib;
    });
    arr.forEach(function(it,i){ it.no = i + 1; });
  }

  var state = { view:"interview", kw:"", mode:"read", filter:"all" };

  /* ================= 三色标记（已掌握 / 不熟练 / 没印象） ================= */
  var MARK_KEY = "wb_marks";
  var marks = {};
  try { marks = JSON.parse(localStorage.getItem(MARK_KEY) || "{}") || {}; } catch(e){ marks = {}; }

  function markKey(it, isIV){ return (isIV ? "iv" : "hr") + "|" + it.title; }
  function getMark(it, isIV){ return marks[markKey(it, isIV)] || "none"; }
  function setMark(it, isIV, st){
    var k = markKey(it, isIV);
    if (!st || st === "none") delete marks[k]; else marks[k] = st;
    try { localStorage.setItem(MARK_KEY, JSON.stringify(marks)); } catch(e){}
  }

  function pad(n){ return n < 10 ? "0" + n : String(n); }

  function hitIV(it){
    var k = state.kw;
    if ((it.title||"").toLowerCase().indexOf(k) >= 0) return true;
    if ((it.module||"").toLowerCase().indexOf(k) >= 0) return true;
    if (it.points) for (var i=0;i<it.points.length;i++){
      if ((it.points[i].text||"").toLowerCase().indexOf(k) >= 0) return true;
      if ((it.points[i].label||"").toLowerCase().indexOf(k) >= 0) return true;
    }
    if ((it.note||"").toLowerCase().indexOf(k) >= 0) return true;
    return false;
  }
  function hitHR(it){
    var k = state.kw;
    if ((it.title||"").toLowerCase().indexOf(k) >= 0) return true;
    if (it.blocks) for (var i=0;i<it.blocks.length;i++){
      if ((it.blocks[i].text||"").toLowerCase().indexOf(k) >= 0) return true;
      if ((it.blocks[i].label||"").toLowerCase().indexOf(k) >= 0) return true;
    }
    if ((it.note||"").toLowerCase().indexOf(k) >= 0) return true;
    return false;
  }

  function card(it, isIV){
    var body = "";
    var parts = isIV ? (it.points || []) : (it.blocks || []);
    for (var i=0;i<parts.length;i++){
      body += '<div class="pt"><span class="pt-label">' + esc(parts[i].label || "") + '</span>'
            + '<div class="pt-text">' + rich(parts[i].text) + '</div></div>';
    }
    if (it.note) body += '<div class="q-note">' + rich(it.note) + '</div>';

    var st = getMark(it, isIV);
    var mk = '<div class="marks">'
      + '<button class="mk mk-red'    + (st === "red"    ? " on" : "") + '" data-st="red">没印象</button>'
      + '<button class="mk mk-yellow' + (st === "yellow" ? " on" : "") + '" data-st="yellow">不熟练</button>'
      + '<button class="mk mk-green'  + (st === "green"  ? " on" : "") + '" data-st="green">已掌握</button>'
      + '</div>';

    return '<article class="q" id="q-' + it.no + '" data-st="' + st + '">'
         +   '<div class="q-head">'
         +     '<span class="q-dot' + (st === "none" ? "" : " " + st) + '"></span>'
         +     '<span class="q-no">' + pad(it.no) + '</span>'
         +     '<h3 class="q-title">' + esc(it.title) + '</h3><span class="q-chev">›</span></div>'
         +   '<div class="q-body">' + mk
         +     '<div class="ans-wrap">'
         +       '<div class="ans-mask"><span>👁 点击显示答案</span></div>'
         +       '<div class="ans-body">' + body + '</div>'
         +     '</div>'
         +   '</div>'
         + '</article>';
  }

  function build(){
    var isIV = state.view === "interview";
    var arr = isIV ? IV : HR;
    var key = isIV ? "module" : "group";
    var vis = [];
    for (var i=0;i<arr.length;i++){
      var it = arr[i];
      if (state.kw && !(isIV ? hitIV(it) : hitHR(it))) continue;
      if (state.filter !== "all" && getMark(it, isIV) !== state.filter) continue;
      vis.push(it);
    }
    var html = "", cur = null, n = 0;
    for (var i=0;i<vis.length;i++){
      var it = vis[i];
      if (it[key] !== cur){
        cur = it[key];
        n = 0;
        for (var j=0;j<vis.length;j++) if (vis[j][key] === cur) n++;
        html += '<div class="mod">' + esc(cur) + '<span class="cnt">' + n + ' 题</span></div>';
      }
      html += card(it, isIV);
    }
    if (!vis.length) return '<div class="empty">' + (state.filter !== "all"
      ? "这个标记下还没有题，先去背几道再来"
      : "没有匹配的题目，换个关键词试试") + '</div>';
    return html;
  }

  function updateStat(){
    var isIV = state.view === "interview";
    var arr = isIV ? IV : HR;
    var c = { green:0, yellow:0, red:0, none:0 };
    for (var i=0;i<arr.length;i++){
      var st = getMark(arr[i], isIV);
      c[st] = (c[st] || 0) + 1;
    }
    document.getElementById("fStat").innerHTML =
      "已掌握 <b>" + c.green + "</b> · 不熟练 " + c.yellow + " · 没印象 " + c.red + " · 剩 " + c.none;
    document.getElementById("fBar").style.width =
      (arr.length ? (c.green / arr.length * 100) : 0) + "%";
    var chips = document.querySelectorAll(".fchip");
    for (var j=0;j<chips.length;j++){
      var f = chips[j].getAttribute("data-f");
      var em = chips[j].querySelector("em");
      if (!em){ em = document.createElement("em"); chips[j].appendChild(em); }
      em.textContent = (f === "all") ? arr.length : (c[f] || 0);
    }
  }

  function render(){
    var isIV = state.view === "interview";
    document.getElementById("vTitle").textContent = isIV ? "面试问题" : "人事问题";
    document.getElementById("vSub").textContent = isIV
      ? "共 " + IV.length + " 题 · " + distinct(IV,"module") + " 个模块"
      : "共 " + HR.length + " 题 · " + distinct(HR,"group") + " 类";
    document.getElementById("cntHint").textContent = isIV
      ? IV.length + " 题 / " + distinct(IV,"module") + " 模块"
      : HR.length + " 题";
    document.getElementById("list").innerHTML = build();
    updateStat();
    var heads = document.querySelectorAll(".q-head");
    for (var i=0;i<heads.length;i++){
      heads[i].onclick = function(){ this.parentNode.classList.toggle("open"); };
    }
  }

  function distinct(arr, key){
    var s = {}, n = 0;
    for (var i=0;i<arr.length;i++){ var k = arr[i][key]; if (!s[k]) { s[k]=1; n++; } }
    return n;
  }

  /* ================= 阅读模式 / 背诵模式 ================= */
  function resetReveal(){
    var ws = document.querySelectorAll(".ans-wrap.revealed");
    for (var i=0;i<ws.length;i++) ws[i].classList.remove("revealed");
  }

  function applyMode(m, silent){
    state.mode = (m === "recite") ? "recite" : "read";
    document.body.classList.toggle("mode-recite", state.mode === "recite");
    var btns = document.querySelectorAll(".mbtn");
    for (var i=0;i<btns.length;i++){
      btns[i].classList.toggle("on", btns[i].getAttribute("data-mode") === state.mode);
    }
    try { localStorage.setItem("wb_mode", state.mode); } catch(e){}
    if (!silent) resetReveal();
  }

  var modeBtns = document.querySelectorAll(".mbtn");
  for (var mi=0; mi<modeBtns.length; mi++){
    modeBtns[mi].onclick = function(){ applyMode(this.getAttribute("data-mode")); };
  }

  function nearest(el, root, cls){
    while (el && el !== root){
      if (el.classList && el.classList.contains(cls)) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* 标记后：背诵模式自动收起本题、展开下一题（跟旧版翻页一个节奏） */
  function goNext(el){
    el.classList.remove("open");
    var nx = el.nextElementSibling;
    while (nx && !(nx.classList && nx.classList.contains("q"))) nx = nx.nextElementSibling;
    if (nx){
      nx.classList.add("open");
      nx.scrollIntoView({ block:"center", behavior:"smooth" });
    }
  }

  document.getElementById("list").addEventListener("click", function(e){
    var root = this;

    /* 点遮罩显示答案 */
    var mask = nearest(e.target, root, "ans-mask");
    if (mask){
      mask.parentNode.classList.add("revealed");
      e.stopPropagation();
      return;
    }

    /* 三色标记 */
    var btn = nearest(e.target, root, "mk");
    if (!btn) return;
    e.stopPropagation();

    var cardEl = nearest(btn, root, "q");
    if (!cardEl) return;

    var isIV = state.view === "interview";
    var arr = isIV ? IV : HR;
    var no = parseInt(String(cardEl.id).replace("q-", ""), 10);
    var item = null;
    for (var i=0;i<arr.length;i++) if (arr[i].no === no){ item = arr[i]; break; }
    if (!item) return;

    var st = btn.getAttribute("data-st");
    var next = (getMark(item, isIV) === st) ? "none" : st;
    setMark(item, isIV, next);

    var btns = cardEl.querySelectorAll(".mk");
    for (var k=0;k<btns.length;k++){
      btns[k].classList.toggle("on", next !== "none" && btns[k].getAttribute("data-st") === next);
    }
    cardEl.setAttribute("data-st", next);
    var dot = cardEl.querySelector(".q-dot");
    if (dot) dot.className = "q-dot" + (next === "none" ? "" : " " + next);

    updateStat();

    if (state.filter !== "all"){ render(); return; }
    if (state.mode === "recite" && next !== "none") goNext(cardEl);
  });

  var savedMode = "read";
  try { savedMode = localStorage.getItem("wb_mode") === "recite" ? "recite" : "read"; } catch(e){}
  if (/mode=recite/.test(location.search)) savedMode = "recite";
  if (/mode=read/.test(location.search)) savedMode = "read";

  var navBtns = document.querySelectorAll(".nav-item");
  for (var i=0;i<navBtns.length;i++){
    navBtns[i].onclick = function(){
      for (var j=0;j<navBtns.length;j++) navBtns[j].classList.remove("active");
      this.classList.add("active");
      state.view = this.getAttribute("data-view");
      state.kw = "";
      state.filter = "all";
      document.getElementById("q").value = "";
      var fcs = document.querySelectorAll(".fchip");
      for (var f=0;f<fcs.length;f++) fcs[f].classList.toggle("on", fcs[f].getAttribute("data-f") === "all");
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    };
  }

  /* 筛选：全部 / 未标记 / 已掌握 / 不熟练 / 没印象 */
  var fchips = document.querySelectorAll(".fchip");
  for (var fi=0; fi<fchips.length; fi++){
    fchips[fi].onclick = function(){
      for (var j=0;j<fchips.length;j++) fchips[j].classList.remove("on");
      this.classList.add("on");
      state.filter = this.getAttribute("data-f");
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    };
  }

  var timer = null;
  document.getElementById("q").oninput = function(){
    var v = this.value.trim().toLowerCase();
    clearTimeout(timer);
    timer = setTimeout(function(){ state.kw = v; render(); }, 130);
  };

  document.getElementById("expandAll").onclick = function(){
    var qs = document.querySelectorAll(".q");
    for (var i=0;i<qs.length;i++) qs[i].classList.add("open");
  };
  document.getElementById("collapseAll").onclick = function(){
    var qs = document.querySelectorAll(".q");
    for (var i=0;i<qs.length;i++) qs[i].classList.remove("open");
  };

  sortBy(IV, "module", MOD_ORDER);
  sortBy(HR, "group", HR_ORDER);
  document.getElementById("nIv").textContent = IV.length;
  document.getElementById("nHr").textContent = HR.length;
  render();
  applyMode((/openall/.test(location.search) && !/mode=/.test(location.search)) ? "read" : savedMode, true);

  if (/openall/.test(location.search)) {
    var all = document.querySelectorAll(".q");
    for (var k=0;k<all.length;k++) all[k].classList.add("open");
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
